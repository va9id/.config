config-version = 2

after-startup-command = []

start-at-login = true

auto-reload-config = false

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
automatically-unhide-macos-hidden-apps = false

persistent-workspaces = ["FINDER", "FOX", "GHOSTTY", "VSCODE", "OBSIDIAN", "CHROME", "XLSX", "8", "9"]

on-mode-changed = []

focus-follows-mouse.enabled = false

key-mapping.preset = 'qwerty'

gaps.inner.horizontal = 8
gaps.inner.vertical =   8
gaps.outer.left =       8
gaps.outer.bottom =     8
gaps.outer.top =        4
gaps.outer.right =      8

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'move-node-to-workspace FINDER'

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = 'move-node-to-workspace FOX'
 
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace GHOSTTY'

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace VSCODE' 
 
[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace OBSIDIAN'
 
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace CHROME'

[[on-window-detected]]
if.app-id = 'com.apple.iWork.Numbers'
run = 'move-node-to-workspace XLSX'


[mode.main.binding]

    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    alt-1 = ['workspace FINDER', 'exec-and-forget open -a "Finder"']
    alt-2 = ['workspace FOX', 'exec-and-forget open -a "Firefox"']
    alt-3 = ['workspace GHOSTTY', 'exec-and-forget open -a "Ghostty"']
    alt-4 = ['workspace VSCODE', 'exec-and-forget open -a "Visual Studio Code"']
    alt-5 = ['workspace OBSIDIAN', 'exec-and-forget open -a "Obsidian"']
    alt-6 = ['workspace CHROME', 'exec-and-forget open -a "Google Chrome"']
    alt-7 = ['workspace XLSX', 'exec-and-forget open -a "Numbers"']
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'

    alt-shift-1 = 'move-node-to-workspace FINDER'
    alt-shift-2 = 'move-node-to-workspace FOX'
    alt-shift-3 = 'move-node-to-workspace GHOSTTY'
    alt-shift-4 = 'move-node-to-workspace VSCODE'
    alt-shift-5 = 'move-node-to-workspace OBSIDIAN'
    alt-shift-6 = 'move-node-to-workspace CHROME'
    alt-shift-7 = 'move-node-to-workspace XLSX'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'
    
    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
    alt-shift-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

